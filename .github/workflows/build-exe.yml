name: Compilar Executável Windows (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Tauri Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de compilação Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Instalar Dependências do Frontend
        run: npm install

      - name: Identificar Versão do Aplicativo
        id: app_info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Compilando versao: $VERSION"

      - name: Compilar App Tauri (.exe e Instalador)
        run: npm run tauri build

      - name: Organizar Arquivos Executáveis (.exe)
        shell: bash
        run: |
          mkdir -p release-artifacts
          
          # Copia o executável portátil (standalone) se gerado
          if [ -f "src-tauri/target/release/zorion-saude.exe" ]; then
            cp "src-tauri/target/release/zorion-saude.exe" "release-artifacts/Zorion-Saude-v${{ steps.app_info.outputs.VERSION }}-Portatil.exe"
          fi
          
          # Copia o instalador NSIS (.exe)
          if [ -d "src-tauri/target/release/bundle/nsis" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/ 2>/dev/null || true
          fi
          
          # Copia instalador MSI se gerado
          if [ -d "src-tauri/target/release/bundle/msi" ]; then
            cp src-tauri/target/release/bundle/msi/*.msi release-artifacts/ 2>/dev/null || true
          fi

          echo "=== ARQUIVOS GERADOS PRONTOS PARA DOWNLOAD ==="
          ls -la release-artifacts/

      - name: Salvar Artefato (.exe) no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Zorion-Saude-v${{ steps.app_info.outputs.VERSION }}-Windows-EXE
          path: release-artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.app_info.outputs.VERSION }}
          name: 'Zorion Saúde v${{ steps.app_info.outputs.VERSION }}'
          body: |
            ## 🚀 Zorion Saúde v${{ steps.app_info.outputs.VERSION }} - Executáveis Windows
            
            Build compilado automaticamente pelo **GitHub Actions**.
            
            ### 📦 Arquivos incluídos:
            - **Instalador com assistente (Setup .exe)**
            - **Versão portátil (Portátil .exe)**
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
