name: 'Zorion Release & Build EXE'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 'Build Windows Executable'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Read Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Tauri App (.exe and installers)
        run: npm run tauri:build

      - name: List Generated Artifacts
        shell: bash
        run: |
          echo "=== Arquivos gerados no src-tauri/target/release ==="
          ls -la src-tauri/target/release/*.exe 2>/dev/null || true
          echo "=== Instaladores em src-tauri/target/release/bundle/ ==="
          ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || true
          ls -la src-tauri/target/release/bundle/msi/ 2>/dev/null || true

      - name: Upload Windows Artifacts (Download no Actions)
        uses: actions/upload-artifact@v4
        with:
          name: zorion-saude-v${{ steps.get_version.outputs.VERSION }}-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/zorion-saude.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: 'Zorion Saúde v${{ steps.get_version.outputs.VERSION }}'
          body: |
            ## Zorion Saúde v${{ steps.get_version.outputs.VERSION }} 🚀
            
            Build compilado automaticamente pelo GitHub Actions.
            
            ### 📦 Arquivos disponíveis para download:
            - **Instalador Windows (.exe)**: Setup executável com assistente de instalação (NSIS).
            - **Instalador MSI (.msi)**: Pacote Windows Installer corporativo.
            - **Executável Direto (.exe)**: Versão standalone portátil.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/zorion-saude.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
